[phases.setup]
nixPkgs = ["python39", "python39Packages.pip", "python39Packages.setuptools", "python39Packages.wheel", "gcc"]

[phases.install]
cmds = [
    "python3.9 -m pip install --upgrade pip setuptools wheel",
    "python3.9 -m pip install -r requirements.txt"
]

[start]
cmd = "gunicorn app:app" 

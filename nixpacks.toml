[phases.setup]
nixPkgs = ["python310", "python310Packages.pip", "python310Packages.setuptools", "python310Packages.wheel", "gcc"]

[phases.install]
cmds = [
    "python3.10 -m pip install --upgrade pip setuptools wheel",
    "python3.10 -m pip install -r requirements.txt"
]

[start]
cmd = "gunicorn app:app" 
